# Clash Verge 配置 - dynfree.proxy.dev
# 代理来源: proxy.scdn.io (GitHub Actions 每天 08:00/14:00/20:00 更新)
# 混合 socks5 + http 代理，健康检查用 HTTP（兼容不支持 CONNECT 的 HTTP 代理）

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
external-controller: 127.0.0.1:9090

# 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# DNS
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29

# 代理集合 - 从 GitHub raw 拉取
proxy-providers:
  proxy-pool:
    type: http
    url: "https://raw.githubusercontent.com/xRetia/dynfree.proxy.dev/main/proxies.yaml"
    interval: 21600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

# 代理组
proxy-groups:
  - name: "代理选择"
    type: url-test
    use:
      - proxy-pool
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    expected-status: 204

  - name: "手动选择"
    type: select
    use:
      - proxy-pool
    proxies:
      - DIRECT

# 路由规则
rules:
  - MATCH,代理选择
