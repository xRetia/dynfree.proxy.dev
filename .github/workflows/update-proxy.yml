name: Update Proxy Pool

on:
  schedule:
    # 每天北京时间 08:00 / 14:00 / 20:00（UTC 00:00 / 06:00 / 12:00）
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
  push:
    # 手动推 tag 触发构建（如 v1.0.0）
    tags:
      - 'v*'
    branches: [main]
    paths:
      - '.github/workflows/update-proxy.yml'
      - 'generate.py'

concurrency:
  group: proxy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (始终检出 main，tag 触发时也把结果提交回 main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 只刷新 proxies.yaml；config.yaml 为静态文件，不受 CI 覆盖
      - name: Generate proxies
        run: python generate.py

      - name: Show summary
        run: |
          echo "=== proxies.yaml (头尾各 10 行) ==="
          head -10 proxies.yaml
          echo "  ..."
          tail -10 proxies.yaml
          echo ""
          echo "节点总数: $(grep -c 'name:' proxies.yaml)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proxies.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh proxy pool [skip ci]"
            git push
          fi
